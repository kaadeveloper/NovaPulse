<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPulse AI</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <div class="brand">
            <img src="logo.png" alt="NovaPulse" class="brand-logo">
            <span>NovaPulse</span>
        </div>

        <button class="new-chat-btn" onclick="newChat()">
            + Nieuwe Chat
        </button>

        <div class="search-box">
            <input type="text" placeholder="Zoek chats...">
        </div>

        <h3>Chats</h3>
        <div id="chatList" class="chat-list"></div>
    </aside>

    <main class="chat-area">
        <header class="topbar">
            <div class="main-title">
                <img src="logo.png" alt="NovaPulse" class="title-logo">
                <span>NovaPulse AI</span>
            </div>
        </header>

        <div id="chat" class="chat-container"></div>

        <div class="inputbar">
            <button class="upload-btn" title="Bestand uploaden">📎</button>

            <input
                id="message"
                type="text"
                placeholder="Typ een bericht..."
                onkeydown="if(event.key==='Enter') sendMessage()"
            >

            <button class="send-btn" onclick="sendMessage()">
                Verstuur
            </button>
        </div>
    </main>

</div>

<script src="script.js"></script>

</body>
</html>
